---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-auth
  namespace: auth
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: basic-auth
  template:
    metadata:
      labels:
        app: basic-auth
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: basic-auth
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: htpasswd
              mountPath: /etc/nginx/htpasswd
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: basic-auth
        - name: htpasswd
          secret:
            secretName: basic-auth-htpasswd
