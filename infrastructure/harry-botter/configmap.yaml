apiVersion: v1
kind: ConfigMap
metadata:
  name: harry-botter
  namespace: harry-botter
data:
  harry-botter.py: |

    import jwt
    import requests
    from datetime import datetime, date, UTC

    METRICS_URL = "http://mimir-gateway.o11y.svc.cluster.local:8080/prometheus/api/v1/query"
    EXPIRY_LABEL = "annotation_recompiled_org_expiry_date"
    NOTE_LABEL = "annotation_recompiled_org_expiry_note"
    DAYS_WARNING = 7
    GITHUB_REPO = "jeversol/home-gitops"
    APP_ID = 1360871
    INSTALLATION_ID = 69529304
    GITHUB_PRIVATE_KEY_PATH = "/etc/github/private-key.pem"

    def load_private_key():
        with open(GITHUB_PRIVATE_KEY_PATH, "r") as f:
            return f.read()

    def generate_jwt(app_id, private_key):
        now = int(datetime.now(UTC).timestamp())
        payload = {
            "iat": now - 60,
            "exp": now + (10 * 60),
            "iss": str(app_id)
        }
        return jwt.encode(payload, private_key, algorithm="RS256")

    def get_installation_token(jwt_token, installation_id):
        headers = {
            "Authorization": f"Bearer {jwt_token}",
            "Accept": "application/vnd.github+json"
        }
        url = f"https://api.github.com/app/installations/{installation_id}/access_tokens"
        response = requests.post(url, headers=headers, timeout=30)
        response.raise_for_status()
        return response.json()["token"]

    def parse_date(date_str):
        try:
            return datetime.strptime(date_str, "%Y-%m-%d").date()
        except ValueError:
            return None

    def should_warn(expiry_date):
        today = date.today()
        delta = (expiry_date - today).days
        return delta <= DAYS_WARNING

    def find_existing_issue(session, repo, token, title):
        url = f"https://api.github.com/repos/{repo}/issues"
        headers = {
            "Authorization": f"Bearer {token}",
            "Accept": "application/vnd.github+json"
        }
        params = {"state": "open"}
        resp = session.get(url, headers=headers, params=params, timeout=30)
        resp.raise_for_status()
        for issue in resp.json():
            if issue["title"] == title:
                return issue
        return None

    def create_issue(session, repo, token, title, body):
        url = f"https://api.github.com/repos/{repo}/issues"
        headers = {
            "Authorization": f"Bearer {token}",
            "Accept": "application/vnd.github+json"
        }
        payload = {"title": title, "body": body}
        resp = session.post(url, headers=headers, json=payload, timeout=30)
        resp.raise_for_status()
        return resp.json()

    def secret_metrics():
        response = requests.get(METRICS_URL, params={
            "query": 'kube_secret_annotations{cluster="talos",job="kube-state-metrics"}'
        }, timeout=30)
        response.raise_for_status()
        payload = response.json()
        if payload["status"] != "success" or payload["data"]["resultType"] != "vector":
            raise RuntimeError("Mimir failed to return Secret annotation metrics")
        samples = payload["data"]["result"]
        if not samples:
            raise RuntimeError("Secret annotation metrics are unavailable")
        return [sample["metric"] for sample in samples]

    def main():
        secrets = secret_metrics()
        print("Loading GitHub App private key...")
        private_key = load_private_key()
        print("Generating GitHub App JWT...")
        jwt_token = generate_jwt(APP_ID, private_key)
        print("Getting GitHub installation token...")
        gh_token = get_installation_token(jwt_token, INSTALLATION_ID)
        session = requests.Session()
        session.timeout = 30

        for labels in secrets:
            expiry_raw = labels.get(EXPIRY_LABEL)
            note = labels.get(NOTE_LABEL)
            if not expiry_raw or not note:
                continue

            namespace = labels["namespace"]
            name = labels["secret"]
            expiry_date = parse_date(expiry_raw)
            if not expiry_date:
                print(f"Skipping {namespace}/{name}: invalid expiry date '{expiry_raw}'")
                continue

            if not should_warn(expiry_date):
                print(f"{namespace}/{name}: expires on {expiry_date} (not within window), skipping")
                continue

            today = date.today()
            already_expired = expiry_date < today
            if already_expired:
                issue_title = f"chore(secrets): {namespace}/{name} has expired"
            else:
                issue_title = f"chore(secrets): {namespace}/{name} expires soon"
            existing_issue = find_existing_issue(session, GITHUB_REPO, gh_token, issue_title)

            if existing_issue:
                print(f"{namespace}/{name}: issue already exists — #{existing_issue['number']}")
                continue

            if already_expired:
                issue_body = (
                    f"The Kubernetes Secret `{name}` in namespace `{namespace}` expired on {expiry_date}.\n"
                    f"\n**Note**: {note}\n\nThis secret is past its expiry date and should be rotated immediately."
                )
            else:
                issue_body = (
                    f"The Kubernetes Secret `{name}` in namespace `{namespace}` is set to expire on {expiry_date}.\n"
                    f"\n**Note**: {note}\n\nPlease rotate the secret before it expires."
                )

            try:
                issue = create_issue(session, GITHUB_REPO, gh_token, issue_title, issue_body)
                print(f"{namespace}/{name}: GitHub issue created — #{issue['number']}")
            except Exception as e:
                print(f"{namespace}/{name}: Failed to create GitHub issue — {str(e)}")

    if __name__ == "__main__":
        main()
