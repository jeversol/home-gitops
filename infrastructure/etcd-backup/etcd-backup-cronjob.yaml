---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: etcd-backup
spec:
  schedule: "2 2 * * *"
  timeZone: "America/New_York"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: etcd-backup
              image: ghcr.io/jeversol/cluster-multitool:latest
              imagePullPolicy: Always
              command: ["/bin/sh"]
              args: ["/scripts/backup.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-minio-secret
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-minio-secret
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-minio-secret
                      key: AWS_ENDPOINT
                - name: BUCKET_NAME
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-minio-secret
                      key: BUCKET_NAME
              volumeMounts:
                - name: backup-script
                  mountPath: /scripts
                  readOnly: true
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: backup-script
              configMap:
                name: etcd-backup-script
                defaultMode: 0755
            - name: talos-secrets
              secret:
                secretName: etcd-backup-talos-secrets
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-backup-talos-secrets
  namespace: etcd-backup
spec:
  roles:
    - os:etcd:backup
