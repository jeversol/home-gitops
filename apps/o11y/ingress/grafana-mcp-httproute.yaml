---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: grafana-mcp
  namespace: o11y
  annotations:
    external-dns.alpha.kubernetes.io/expose: "true"
spec:
  parentRef:
    name: ingress
    namespace: gateway
  listeners:
    - name: grafana-mcp
      protocol: HTTPS
      port: 443
      hostname: grafana-mcp.i.recompiled.org
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: grafana-mcp-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-mcp
  namespace: o11y
  annotations:
    external-dns.alpha.kubernetes.io/expose: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: grafana-mcp
      sectionName: grafana-mcp
  hostnames:
    - grafana-mcp.i.recompiled.org
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: grafana-mcp
          port: 8000
