---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: metrics
  namespace: o11y
spec:
  parentRef:
    name: ingress
    namespace: gateway
  listeners:
    - name: metrics
      protocol: HTTPS
      port: 443
      hostname: metrics.i.recompiled.org
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: metrics-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metrics
  namespace: o11y
  annotations:
    external-dns.alpha.kubernetes.io/expose: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: metrics
      sectionName: metrics
  hostnames:
    - metrics.i.recompiled.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mimir-gateway
          port: 8080
