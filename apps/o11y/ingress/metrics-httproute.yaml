---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metrics
  namespace: o11y
  annotations:
    external-dns.alpha.kubernetes.io/expose: "true"
spec:
  parentRefs:
    - name: ingress
      namespace: gateway
      sectionName: metrics
  hostnames:
    - metrics.i.recompiled.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: basic-auth
              namespace: auth
              port: 80
            http: {}
      backendRefs:
        - name: mimir-gateway
          port: 8080
