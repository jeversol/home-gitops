---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: scrutiny
  namespace: o11y
spec:
  parentRef:
    name: ingress
    namespace: gateway
  listeners:
    - name: scrutiny
      protocol: HTTPS
      port: 443
      hostname: scrutiny.i.recompiled.org
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: scrutiny-tls-cert
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scrutiny
  namespace: o11y
  annotations:
    external-dns.alpha.kubernetes.io/expose: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: scrutiny
      sectionName: scrutiny
  hostnames:
    - scrutiny.i.recompiled.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: scrutiny
          port: 8080
