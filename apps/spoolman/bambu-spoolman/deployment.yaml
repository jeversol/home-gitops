apiVersion: apps/v1
kind: Deployment
metadata:
  name: bambu-spoolman
  namespace: spoolman
  labels:
    app: bambu-spoolman
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bambu-spoolman
  template:
    metadata:
      labels:
        app: bambu-spoolman
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: bambu-spoolman
          image: ghcr.io/jeversol/bambu-spoolman:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: bambu-spoolman-config
            - secretRef:
                name: bambu-spoolman-printer
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
            - name: frontend-cache
              mountPath: /app/frontend/.next/cache
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bambu-spoolman-config
        - name: tmp
          emptyDir:
            medium: Memory
        - name: frontend-cache
          emptyDir: {}
