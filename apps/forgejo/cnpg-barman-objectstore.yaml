apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-forgejo-store
  namespace: forgejo
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: "s3://cnpg-forgejo/cnpg-forgejo"
    endpointURL: "https://nas.i.recompiled.org:3900"
    s3Credentials:
      accessKeyId:
        name: cnpg-forgejo-barman-creds
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-forgejo-barman-creds
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: lz4
    data:
      compression: lz4
