apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: forgejo-postgres-daily
  namespace: forgejo
spec:
  schedule: "0 45 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: forgejo-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
