apiVersion: apps/v1
kind: Deployment
metadata:
  name: bindery
  namespace: media
  labels:
    app: bindery
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bindery
  template:
    metadata:
      labels:
        app: bindery
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1029
        runAsGroup: 65537
        fsGroup: 65537
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bindery
          image: ghcr.io/vavallee/bindery:v1.33.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
              name: http
              protocol: TCP
          env:
            - name: BINDERY_PORT
              value: "8787"
            - name: BINDERY_DB_PATH
              value: /config/bindery.db
            - name: BINDERY_DATA_DIR
              value: /config
            - name: BINDERY_LOG_LEVEL
              value: info
            - name: BINDERY_DOWNLOAD_DIR
              value: /media/Downloads/complete
            - name: BINDERY_LIBRARY_DIR
              value: /media/Books
            - name: BINDERY_AUDIOBOOK_DIR
              value: /media/Audiobooks
            - name: BINDERY_DOWNLOAD_PATH_REMAP
              value: /downloads:/media/Downloads
            - name: BINDERY_PUID
              value: "1029"
            - name: BINDERY_PGID
              value: "65537"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-storage
              mountPath: /media
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bindery-config
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-storage
        - name: tmp
          emptyDir: {}
