apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: plex
  namespace: media
spec:
  repository:
    kind: ClusterRepository
    name: home-cluster
  sources:
    - pvc:
        name: config-plex-0
  copyMethod: Clone
  staging:
    storageClassName: linstor-r1
  retention:
    keepDaily: 7
    keepWeekly: 4
  compression:
    compressor: zstd
  verification:
    quick:
      schedule:
        cron: "30 9 * * 0"
        timezone: UTC
    verifyFilesPercent: 5
    successExpr: stats.files > 0 && stats.errors == 0
  mover:
    securityContext:
      runAsUser: 1029
      runAsGroup: 65537
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  credentialProjection:
    enabled: true
