name: Build and Push Renovate Webhook

on:
  push:
    branches: [main]
    paths:
      - 'tools/renovate-webhook/**'
      - '.github/workflows/renovate-webhook-build.yml'

jobs:
  build-renovate-webhook:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: jeversol
          password: ${{ github.token }}

      - name: Build and push Renovate webhook image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: tools/renovate-webhook
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jeversol/renovate-webhook:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
