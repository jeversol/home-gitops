---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  interval: 30m
  path: ./infrastructure/gateway
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: gateway-api
  sourceRef:
    kind: GitRepository
    name: flux-system
