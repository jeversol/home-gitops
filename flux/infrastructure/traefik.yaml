---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  url: oci://ghcr.io/traefik/helm/traefik
  ref:
    tag: "41.1.0"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  targetNamespace: traefik
  dependsOn:
    - name: cert-manager
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  interval: 30m
  releaseName: traefik
  driftDetection:
    mode: disabled
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: flux-system
  values:
    deployment:
      replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    api:
      dashboard: true
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.i.recompiled.org`)
        entryPoints:
          - websecure
        tls:
          secretName: traefik-dashboard-tls
    metrics:
      prometheus:
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        service:
          enabled: true
    service:
      type: LoadBalancer
      annotations:
        io.cilium/lb-ipam-ips: "192.168.1.240"
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    resources:
      requests:
        cpu: 100m
        memory: 248Mi
      limits:
        memory: 296Mi
