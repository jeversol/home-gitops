apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  url: oci://quay.io/jetstack/charts/cert-manager
  ref:
    tag: "v1.21.1"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  targetNamespace: cert-manager
  interval: 30m
  releaseName: cert-manager
  driftDetection:
    mode: warn
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
      - paths: ["/spec/replicas"]
        target:
          kind: StatefulSet
  chartRef:
    kind: OCIRepository
    name: cert-manager
    namespace: flux-system
  install:
    createNamespace: true
  values:
    crds:
      enabled: true
      keep: true
    prometheus:
      enabled: true
      servicemonitor:
        enabled: false
    # Service annotations for Prometheus discovery
    serviceAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9402"
      prometheus.io/path: "/metrics"
    resources:
      requests:
        cpu: 25m
        memory: 121Mi
      limits:
        memory: 151Mi
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  interval: 30m
  path: ./infrastructure/cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age