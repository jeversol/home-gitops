---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 15m
  url: oci://ghcr.io/grafana-community/helm-charts/grafana
  ref:
    tag: "13.2.1"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 30m
  releaseName: grafana
  targetNamespace: o11y
  chartRef:
    kind: OCIRepository
    name: grafana
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicas: 1

    deploymentStrategy:
      type: Recreate

    persistence:
      enabled: true
      existingClaim: kube-prometheus-stack-grafana
      size: 10Gi

    envFromSecrets:
      - name: grafana-auth0-secret

    grafana.ini:
      server:
        root_url: https://grafana.i.recompiled.org
      security:
        allow_embedding: true
      auth.generic_oauth:
        name: Auth0
        enabled: true
        client_id: JtRexMDMxdefHYCylMmbW6Zq9ElFXZcE
        client_secret: $__env{CLIENT_SECRET}
        scopes: openid profile email
        auth_url: https://auth.recompiled.org/authorize
        token_url: https://auth.recompiled.org/oauth/token
        api_url: https://auth.recompiled.org/userinfo
        allow_sign_up: true
        auto_login: false
        allow_assign_grafana_admin: true
        role_attribute_path: email == 'joe@recompiled.org' && 'GrafanaAdmin' || 'Viewer'
      users:
        auto_assign_org_role: Viewer
      auth:
        oauth_auto_login: false
        disable_login_form: false

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
