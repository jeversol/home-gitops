---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 15m
  url: oci://ghcr.io/grafana-community/helm-charts/loki
  ref:
    tag: "18.11.6"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 30m
  releaseName: loki
  targetNamespace: o11y
  chartRef:
    kind: OCIRepository
    name: loki
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: Monolithic

    loki:
      auth_enabled: false

      commonConfig:
        replication_factor: 3
        path_prefix: /var/loki

      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      ingester:
        chunk_encoding: snappy

      querier:
        max_concurrent: 4

      storage:
        type: s3
        bucketNames:
          chunks: loki
          ruler: loki
          admin: loki
        use_thanos_objstore: true
        object_store:
          type: s3
          s3:
            endpoint: nas.i.recompiled.org:3900
            region: us-east-1
            access_key_id: ${AWS_ACCESS_KEY_ID}
            secret_access_key: ${AWS_SECRET_ACCESS_KEY}
            insecure: false

      storage_config:
        tsdb_shipper:
          active_index_directory: /var/loki/index
          cache_location: /var/loki/cache

      limits_config:
        retention_period: 720h
        reject_old_samples_max_age: 720h

      pattern_ingester:
        enabled: true

      compactor:
        working_directory: /var/loki/compactor
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 2h
        retention_delete_worker_count: 150
        delete_request_store: s3

    ruler:
      enabled: false

    lokiCanary:
      enabled: false

    singleBinary:
      replicas: 3
      sidecar: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: single-binary
                  app.kubernetes.io/instance: loki
                  app.kubernetes.io/name: loki
              topologyKey: kubernetes.io/hostname
      extraEnvFrom:
        - secretRef:
            name: loki-s3-credentials
      persistence:
        enabled: true
        storageClass: linstor-r3
        size: 5Gi
      podDisruptionBudget:
        enabled: true
        minAvailable: 2
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi

    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    test:
      enabled: false

    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    minio:
      enabled: false

    gateway:
      enabled: false
