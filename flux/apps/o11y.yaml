apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: o11y
  namespace: flux-system
spec:
  interval: 15m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/o11y
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
