apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-backups
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/kopiur
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
  dependsOn:
    - name: kopiur-config
    - name: media
    - name: homebridge
    - name: o11y
    - name: spoolman-bambu
