---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: grafana-mcp
  namespace: flux-system
spec:
  interval: 15m
  url: oci://ghcr.io/grafana-community/helm-charts/grafana-mcp
  ref:
    tag: "0.37.0"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-mcp
  namespace: flux-system
spec:
  interval: 30m
  releaseName: grafana-mcp
  targetNamespace: o11y
  dependsOn:
    - name: grafana
  chartRef:
    kind: OCIRepository
    name: grafana-mcp
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: grafana-mcp
    replicas: 1
    grafana:
      url: http://grafana.o11y.svc.cluster.local
      apiKeySecret:
        name: grafana-mcp-secret
        key: grafana-token
    serverAuth:
      tokenSecret:
        name: grafana-mcp-secret
        key: server-token
    disableWrite: true
    extraArgs:
      - --transport=streamable-http
      - --address=:8000
      - --allowed-hosts=grafana-mcp.i.recompiled.org,grafana-mcp.i.recompiled.org:443,localhost:8000,127.0.0.1:8000
      - --healthz-address=:8080
    env:
      GRAFANA_USAGE_STATS: disabled
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8080
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 20
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
