---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 30m
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  ref:
    tag: "0.63.1"
    digest: sha256:81f946f697a1df9ee3d75cafa9cd979ae3a2ea79f0922b07b279bbeda34ff6df
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 30m
  releaseName: flux-operator
  targetNamespace: flux-system
  driftDetection:
    mode: warn
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Minimal values - operator should adopt existing resources
    watchAllNamespaces: false
    web:
      config:
        baseURL: https://flux.i.recompiled.org
        authentication:
          type: Anonymous
          anonymous:
            username: flux
            groups:
              - flux-web-admin
